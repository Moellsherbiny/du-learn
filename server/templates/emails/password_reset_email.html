<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>إعادة تعيين كلمة المرور</title>
</head>

<body
    style="
        margin: 0;
        padding: 0;
        background-color: #f7f5ef;
        font-family: Arial, Helvetica, sans-serif;
        color: #262923;
    "
>
    <div
        style="
            width: 100%;
            padding: 48px 16px;
            box-sizing: border-box;
        "
    >
        <div
            style="
                max-width: 560px;
                margin: 0 auto;
                background-color: #fffefa;
                border: 1px solid #e4e0d7;
                border-radius: 18px;
                overflow: hidden;
            "
        >
            <!-- Header -->
            <div
                style="
                    padding: 28px 32px;
                    border-bottom: 1px solid #e4e0d7;
                "
            >
                <div
                    style="
                        display: inline-block;
                        width: 38px;
                        height: 38px;
                        line-height: 38px;
                        text-align: center;
                        border: 1px solid #d8c7b2;
                        border-radius: 10px;
                        color: #9a6037;
                        font-size: 17px;
                        font-weight: bold;
                    "
                >
                    DU
                </div>

                <span
                    style="
                        margin-right: 10px;
                        font-size: 15px;
                        font-weight: 700;
                        color: #262923;
                        vertical-align: top;
                        line-height: 38px;
                    "
                >
                    DU Learn
                </span>
            </div>

            <!-- Content -->
            <div style="padding: 36px 32px;">
                <h1
                    style="
                        margin: 0;
                        font-size: 22px;
                        line-height: 1.7;
                        color: #262923;
                    "
                >
                    إعادة تعيين كلمة المرور
                </h1>

                <p
                    style="
                        margin: 18px 0 0;
                        font-size: 14px;
                        line-height: 2;
                        color: #686b63;
                    "
                >
                    مرحبًا
                    {{ user.get_full_name|default:user.email }}،
                </p>

                <p
                    style="
                        margin: 12px 0 0;
                        font-size: 14px;
                        line-height: 2;
                        color: #686b63;
                    "
                >
                    تلقينا طلبًا لإعادة تعيين كلمة المرور
                    الخاصة بحسابك في DU Learn.
                </p>

                <div style="margin-top: 28px;">
                    <a
                        href="{{ frontend_url }}/reset-password/{{ uid }}/{{ token }}"
                        style="
                            display: inline-block;
                            padding: 13px 22px;
                            background-color: #9a6037;
                            color: #fffdf8;
                            text-decoration: none;
                            border-radius: 10px;
                            font-size: 13px;
                            font-weight: 700;
                        "
                    >
                        إعادة تعيين كلمة المرور
                    </a>
                </div>

                <p
                    style="
                        margin: 28px 0 0;
                        padding-top: 22px;
                        border-top: 1px solid #ebe7df;
                        font-size: 12px;
                        line-height: 2;
                        color: #85877f;
                    "
                >
                    إذا لم تطلب إعادة تعيين كلمة المرور،
                    يمكنك تجاهل هذه الرسالة بأمان.
                </p>
            </div>

            <!-- Footer -->
            <div
                style="
                    padding: 20px 32px;
                    background-color: #faf8f2;
                    border-top: 1px solid #e4e0d7;
                "
            >
                <p
                    style="
                        margin: 0;
                        font-size: 11px;
                        line-height: 1.8;
                        color: #8a8c84;
                    "
                >
                    هذه الرسالة أُرسلت تلقائيًا من نظام DU Learn.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
